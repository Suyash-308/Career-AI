<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Career Guidance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Create Your CareerAI Account</h1>
        <p>Sign up to start your personalized career journey</p>
    </header>

    <section class="form-section">
        <form action="login.html" method="get" class="form-card">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Re-enter your password" required>

            <button type="submit" class="btn">Register</button>

            <p class="small-text">Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </section>

    <footer>
        <p>© 2025 CareerAI | Designed for Educational Use</p>
    </footer>
</body>
</html>
