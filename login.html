<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Career Guidance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>CareerAI</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="assessment.html">Career Test</a></li>
        </ul>
    </nav>

    <header>
        <h1>Welcome Back!</h1>
        <p>Login to your CareerAI account</p>
    </header>

    <section class="form-section">
        <form action="assessment.html" method="get" class="form-card">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit" class="btn">Login</button>

            <p class="small-text">Don't have an account? <a href="register.html">Register here</a></p>
        </form>
    </section>

    <footer>
        <p>© 2025 CareerAI | Designed for Educational Use</p>
    </footer>
</body>
</html>
