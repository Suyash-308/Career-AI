<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assessment | AI Career Guidance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>CareerAI</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="assessment.html" class="active">Career Test</a></li>
        </ul>
    </nav>

    <header>
        <h1>Career Assessment</h1>
        <p>Answer a few questions to discover your best career match.</p>
    </header>

    <form action="result.html" method="get" class="quiz-form">
        <label>1. Which subject do you enjoy the most?</label>
        <select name="subject">
            <option>Mathematics</option>
            <option>Biology</option>
            <option>History</option>
            <option>Art</option>
            <option>Commerce</option>
        </select>

        <label>2. What kind of work do you enjoy?</label>
        <select name="work">
            <option>Solving problems</option>
            <option>Helping people</option>
            <option>Designing or creating</option>
            <option>Managing teams</option>
        </select>

        <label>3. What is your strongest skill?</label>
        <select name="skill">
            <option>Analytical Thinking</option>
            <option>Creativity</option>
            <option>Communication</option>
            <option>Leadership</option>
        </select>

        <label>4. Which stream did you study?</label>
        <select name="stream">
            <option>Science</option>
            <option>Commerce</option>
            <option>Arts</option>
        </select>

        <button type="submit" class="btn">Submit and Get Result</button>
    </form>

    <footer>
        <p>© 2025 CareerAI | All rights reserved</p>
    </footer>
</body>
</html>
